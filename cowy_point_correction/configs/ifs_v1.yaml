# ============================================================
# Experiment metadata
# ============================================================
experiment:
  name: ifs_point_correction_v1
  description: >
    Point-based IFS/HRRR wind speed bias correction using MADIS
    observations and terrain covariates.
  seed: 42


# ============================================================
# Paths
# ============================================================
paths:
  # Raw datasets
  madis: "/projects/cowy/datasets/cowy_qc_madis/cowy_madis_metar_mesonet_2024_transposed.nc"

  # These should be synced to $TMPDIR by prepare_data.py
  terrain_dir: /projects/cowy/datasets/terrain_data/terrain_990m

  ifs_dir: $TMPDIR/ifs #/scratch/kylabazlen/herbie/ifs

  # Output root (Lightning logs, checkpoints, eval results)
  output_root: /scratch/kylabazlen/ml_test/v1/runs

  # Cached metadata
  obs_lookup: /scratch/kylabazlen/ml_test/v1/prepare_data/obs_lookup.csv

  # Normalization
  mean_file: /scratch/kylabazlen/ml_test/v1/prepare_data/mean_v1.npy
  std_file: /scratch/kylabazlen/ml_test/v1/prepare_data/sd_v1.npy

  dem: /projects/cowy/datasets/terrain_data/terrain_990m/conus_elev_reprojected_wgs84_cowy_990m.nc

# ============================================================
# Data preparation & filtering
# ============================================================
data:
  dist_lim: 0.25  # Nearest-neighbor matching threshold (degrees)
  max_hrrr_files: null #read in n files from the forecast dir

  # Spatial blocking (checkerboard)
  spatial_block:
    block_size: 2.0     # degrees
    n_folds: 2

  # Validation split (after spatial blocking)
  val_fraction: 0.20
  shuffle_timesteps: true

  # Class imbalance handling
  balance_classes: false
  balance_thresholds: [5, 11]   # wind speed bins (m/s)

  # Data loader
  num_workers: 0
  pin_memory: true
  persistent_workers: true
  drop_last: false # keep full batches
  

# ============================================================
# Feature engineering
# ============================================================
features:
  # HRRR / IFS variables pulled directly
  hrrr:
    - u10
    - v10
    - ws_10
    - t2m
    - sp
    - t_500hPa
    - elr

  # Terrain variables (ALL 2D vars will be used)
  topo: all

  # Time encodings (future-proof)
  time_encoding:
    enabled: false
    include:
      - hour
      - dayofyear


# ============================================================
# Model architecture
# ============================================================
model:
  type: point_mlp
  n_filters: 640
  dropout: 0.25

  # Regularization
  l1_lambda: 1.0e-6


# ============================================================
# Training configuration
# ============================================================
training:
  batch_size: 1024 ### was running well on 256
  max_epochs: 40 

  optimizer:
    type: AdamW
    learning_rate: 1.0e-4
    eps: 1.0e-5
    weight_decay: 1.0e-4

  precision: 16-mixed
  gradient_clip_val: null

  # Early stopping (deliberately loose, matching notebook)
  early_stopping:
    enabled: true
    monitor: validation_loss
    patience: 500
    min_delta: 0.0


# ============================================================
# Logging & checkpoints
# ============================================================
logging:
  log_every_n_steps: 1

  tensorboard:
    enabled: true

  csv:
    enabled: true

  checkpoint:
    monitor: validation_loss
    mode: min
    save_top_k: 1


# ============================================================
# Evaluation
# ============================================================
evaluation:
  bins: [5, 10]
  save_predictions: true
  save_obs_lookup: true

  plots:
    map:
      enabled: true
      coastline_resolution: 10m
    scatter:
      enabled: true
    confusion_matrix:
      enabled: true
